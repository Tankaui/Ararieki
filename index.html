<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>採購定價與毛利試算工具</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f0ef;
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        .card:last-child {
            margin-bottom: 0;
        }
        h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #6d6466;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 8px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #a69698;
        }
        .result-box {
            margin-top: 10px;
            padding: 15px;
            border-radius: 8px;
            background-color: #e6e6e6;
            color: #4a4a4a;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            transition: background-color 0.4s ease, color 0.4s ease;
            min-height: 48px;
            line-height: 1.4;
        }
        .small-text {
            font-size: 0.9rem;
            font-weight: normal;
            opacity: 0.8;
            display: block;
        }

        /* 比較區塊專用排版 */
        .compare-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .compare-row input {
            flex: 1.2;
        }
        .compare-badge {
            flex: 1;
            padding: 10px 6px;
            border-radius: 6px;
            background-color: #e6e6e6;
            color: #4a4a4a;
            font-size: 0.95rem;
            font-weight: bold;
            text-align: center;
            box-sizing: border-box;
            transition: background-color 0.4s ease, color 0.4s ease;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- 新增區塊：同成本多階賣價毛利比對 -->
    <div class="card">
        <h2>多階賣價毛利比對</h2>
        <div class="form-group">
            <label for="compCost">進貨成本 (未稅 / 元)：</label>
            <input type="number" id="compCost" inputmode="decimal" step="any" placeholder="例如：27" oninput="calcMultiCompare()">
        </div>
        
        <label style="margin-bottom: 8px;">比較終端售價 (含稅 / 元)：</label>
        
        <div class="compare-row">
            <input type="number" id="compPrice1" inputmode="decimal" step="any" placeholder="賣價 1 (如 59)" oninput="calcMultiCompare()">
            <div id="compBadge1" class="compare-badge">毛利：---%</div>
        </div>
        
        <div class="compare-row">
            <input type="number" id="compPrice2" inputmode="decimal" step="any" placeholder="賣價 2 (如 69)" oninput="calcMultiCompare()">
            <div id="compBadge2" class="compare-badge">毛利：---%</div>
        </div>
        
        <div class="compare-row">
            <input type="number" id="compPrice3" inputmode="decimal" step="any" placeholder="賣價 3 (如 79)" oninput="calcMultiCompare()">
            <div id="compBadge3" class="compare-badge">毛利：---%</div>
        </div>
    </div>

    <!-- 區塊 1：毛利率驗算 -->
    <div class="card">
        <h2>單項毛利率驗算</h2>
        <div class="form-group">
            <label for="cost2">進貨成本 (未稅 / 元)：</label>
            <input type="number" id="cost2" inputmode="decimal" step="any" placeholder="例如：27" oninput="calcMargin()">
        </div>
        <div class="form-group">
            <label for="price2">終端售價 (含稅 / 元)：</label>
            <input type="number" id="price2" inputmode="decimal" step="any" placeholder="例如：69" oninput="calcMargin()">
        </div>
        <div id="res2" class="result-box" style="display: flex; align-items: center; justify-content: center;">毛利率：---%</div>
    </div>

    <!-- 區塊 2：建議售價試算 -->
    <div class="card">
        <h2>建議售價試算 (保底 55% 毛利 + 尾數 9)</h2>
        <div class="form-group">
            <label for="cost1">進貨成本 (未稅 / 元)：</label>
            <input type="number" id="cost1" inputmode="decimal" step="any" placeholder="例如：27" oninput="calcPrice()">
        </div>
        <div id="res1" class="result-box">建議含稅售價：$---<br><span class="small-text">(實際毛利: ---%)</span></div>
    </div>

    <!-- 區塊 3：目標成本推算 -->
    <div class="card">
        <h2>目標成本推算 (毛利 50% ~ 55%)</h2>
        <div class="form-group">
            <label for="price3">終端希望賣價 (含稅 / 元)：</label>
            <input type="number" id="price3" inputmode="decimal" step="any" placeholder="例如：99" oninput="calcTargetCost()">
        </div>
        <div id="res3" class="result-box">可接受未稅成本：$---<br><span class="small-text">(對應毛利門檻: 55% ~ 50%)</span></div>
    </div>

<script>
    const tenderGreenBg = '#e2ebd8';
    const tenderGreenText = '#38473a';
    const defaultGrayBg = '#e6e6e6';
    const defaultGrayText = '#4a4a4a';

    // 色階警示渲染共用函式
    function applyColorAlert(element, margin) {
        if (margin >= 55) {
            let percent = Math.min(1, (margin - 55) / 30);
            let lightness = 92 - (percent * 40); 
            element.style.backgroundColor = `hsl(140, 30%, ${lightness}%)`;
            element.style.color = lightness < 65 ? '#ffffff' : '#2c4c3b';
        } else {
            let percent = Math.min(1, Math.max(0, 55 - margin) / 30);
            let lightness = 95 - (percent * 35);
            element.style.backgroundColor = `hsl(350, 40%, ${lightness}%)`;
            element.style.color = lightness < 65 ? '#ffffff' : '#5c2223';
        }
    }

    // 重設回灰底共用函式
    function resetStyle(element, defaultText) {
        element.innerHTML = defaultText;
        element.style.backgroundColor = defaultGrayBg;
        element.style.color = defaultGrayText;
    }

    // 新增區塊：多階賣價比較運算
    function calcMultiCompare() {
        let cost = parseFloat(document.getElementById('compCost').value);
        let prices = [
            parseFloat(document.getElementById('compPrice1').value),
            parseFloat(document.getElementById('compPrice2').value),
            parseFloat(document.getElementById('compPrice3').value)
        ];

        for (let i = 1; i <= 3; i++) {
            let badge = document.getElementById(`compBadge${i}`);
            let p = prices[i - 1];

            if (isNaN(cost) || isNaN(p) || cost < 0 || p <= 0) {
                resetStyle(badge, '毛利：---%');
                continue;
            }

            let margin = ((p - cost) / p) * 100;
            badge.innerHTML = `毛利：${margin.toFixed(1)}%`;
            applyColorAlert(badge, margin);
        }
    }

    // 區塊 1 的計算邏輯
    function calcMargin() {
        let cost = parseFloat(document.getElementById('cost2').value);
        let price = parseFloat(document.getElementById('price2').value);
        let resBox = document.getElementById('res2');
        
        if (isNaN(cost) || isNaN(price) || cost < 0 || price <= 0) {
            resetStyle(resBox, '毛利率：---%');
            return;
        }
        
        let margin = ((price - cost) / price) * 100;
        resBox.innerHTML = `毛利率：${margin.toFixed(1)}%`;
        applyColorAlert(resBox, margin);
    }

    // 區塊 2 的計算邏輯
    function calcPrice() {
        let cost = parseFloat(document.getElementById('cost1').value);
        let resBox = document.getElementById('res1');
        
        if (isNaN(cost) || cost <= 0) {
            resetStyle(resBox, '建議含稅售價：$---<br><span class="small-text">(實際毛利: ---%)</span>');
            return;
        }
        
        let rawPrice = cost / (1 - 0.55);
        let candidate = Math.floor(rawPrice / 10) * 10 + 9;
        if (candidate < rawPrice) {
            candidate += 10;
        }
        
        let actualMargin = ((candidate - cost) / candidate) * 100;
        resBox.innerHTML = `建議含稅售價：$${candidate}<br><span class="small-text">(實際毛利: ${actualMargin.toFixed(1)}%)</span>`;
        resBox.style.backgroundColor = tenderGreenBg;
        resBox.style.color = tenderGreenText;
    }

    // 區塊 3 的計算邏輯
    function calcTargetCost() {
        let price = parseFloat(document.getElementById('price3').value);
        let resBox = document.getElementById('res3');
        
        if (isNaN(price) || price <= 0) {
            resetStyle(resBox, '可接受未稅成本：$---<br><span class="small-text">(對應毛利門檻: 55% ~ 50%)</span>');
            return;
        }
        
        let maxCost = (price * (1 - 0.50)).toFixed(1); 
        let minCost = (price * (1 - 0.55)).toFixed(1); 
        
        resBox.innerHTML = `可接受未稅成本：$${minCost} ～ $${maxCost}<br><span class="small-text">(依序對應毛利：55% ～ 50%)</span>`;
        resBox.style.backgroundColor = tenderGreenBg;
        resBox.style.color = tenderGreenText;
    }
</script>

</body>
</html>
